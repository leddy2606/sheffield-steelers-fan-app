name: Refresh and publish

on:
  schedule:
    - cron: "17 */3 * * *"
    # One standard five-minute schedule is substantially more reliable on GitHub
    # than many overlapping cron entries. Outside a scheduled match window it only
    # runs the local timestamp check below and contacts no external sites.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check scheduled match window without contacting external sites
        id: window
        run: python scripts/check_match_window.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || github.event.schedule == '17 */3 * * *' || steps.window.outputs.active == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install free gamesheet reader
        if: github.event_name != 'schedule' || github.event.schedule == '17 */3 * * *' || steps.window.outputs.active == 'true'
        run: python -m pip install -r requirements.txt
      - name: Test updater parsers and live-score safeguards
        if: github.event_name != 'schedule' || github.event.schedule == '17 */3 * * *' || steps.window.outputs.active == 'true'
        run: python -m unittest scripts.test_update_data -v
      - name: Refresh official EIHL data
        id: refresh
        if: github.event_name != 'schedule' || github.event.schedule == '17 */3 * * *' || steps.window.outputs.active == 'true'
        run: python scripts/update_data.py
      - name: Prepare free static site
        if: github.event_name != 'schedule' || github.event.schedule == '17 */3 * * *' || steps.window.outputs.active == 'true'
        run: |
          mkdir public
          cp index.html manifest.webmanifest service-worker.js CNAME public/
          cp -r assets data public/
      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' || github.event.schedule == '17 */3 * * *' || steps.window.outputs.active == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || github.event.schedule == '17 */3 * * *' || steps.window.outputs.active == 'true'
        with:
          path: public
      - uses: actions/deploy-pages@v4
        if: github.event_name != 'schedule' || github.event.schedule == '17 */3 * * *' || steps.window.outputs.active == 'true'
