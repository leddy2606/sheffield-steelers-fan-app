name: Refresh and publish

on:
  schedule:
    - cron: "17 */3 * * *"
    # Offset from the busiest start-of-hour window to reduce delayed/dropped GitHub schedules.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install free gamesheet reader
        run: python -m pip install -r requirements.txt
      - name: Refresh official EIHL data
        id: refresh
        run: python scripts/update_data.py
      - name: Check live game window
        id: live
        run: python -c "import json; print('active=' + str(json.load(open('data/app-data.json'))['live_window']).lower())" >> "$GITHUB_OUTPUT"
      - name: Prepare free static site
        if: github.event_name != 'schedule' || github.event.schedule == '17 */3 * * *' || steps.live.outputs.active == 'true'
        run: |
          mkdir public
          cp index.html manifest.webmanifest service-worker.js public/
          cp -r assets data public/
      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' || github.event.schedule == '17 */3 * * *' || steps.live.outputs.active == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || github.event.schedule == '17 */3 * * *' || steps.live.outputs.active == 'true'
        with:
          path: public
      - uses: actions/deploy-pages@v4
        if: github.event_name != 'schedule' || github.event.schedule == '17 */3 * * *' || steps.live.outputs.active == 'true'
