name: Refresh and publish

on:
  schedule:
    - cron: "17 */3 * * *"
    # Two staggered schedules provide match-time redundancy. Outside a scheduled
    # match window they only run the local timestamp check below and contact no sites.
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check scheduled match window without contacting external sites
        id: window
        run: python scripts/check_match_window.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || github.event.schedule == '17 */3 * * *' || steps.window.outputs.active == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install free gamesheet reader
        if: github.event_name != 'schedule' || github.event.schedule == '17 */3 * * *' || steps.window.outputs.active == 'true'
        run: python -m pip install -r requirements.txt
      - name: Refresh official EIHL data
        id: refresh
        if: github.event_name != 'schedule' || github.event.schedule == '17 */3 * * *' || steps.window.outputs.active == 'true'
        run: python scripts/update_data.py
      - name: Prepare free static site
        if: github.event_name != 'schedule' || github.event.schedule == '17 */3 * * *' || steps.window.outputs.active == 'true'
        run: |
          mkdir public
          cp index.html manifest.webmanifest service-worker.js public/
          cp -r assets data public/
      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' || github.event.schedule == '17 */3 * * *' || steps.window.outputs.active == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || github.event.schedule == '17 */3 * * *' || steps.window.outputs.active == 'true'
        with:
          path: public
      - uses: actions/deploy-pages@v4
        if: github.event_name != 'schedule' || github.event.schedule == '17 */3 * * *' || steps.window.outputs.active == 'true'
